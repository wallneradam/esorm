[pytest]
filterwarnings = ignore::DeprecationWarning

asyncio_mode = auto
# Tests of a class share the ES connection, so they should run in the same event loop
asyncio_default_fixture_loop_scope = class
asyncio_default_test_loop_scope = class
;log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)8s %(name)16s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

addopts = -rs --spec -x
