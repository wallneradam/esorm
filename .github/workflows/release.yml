name: Release

# Publishing a GitHub Release (tag: vX.Y.Z) runs the tests, builds the package
# and uploads it to PyPI using Trusted Publishing (no API token needed).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check that the tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the version in pyproject.toml ('$VERSION')"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyesorm/
    permissions:
      id-token: write  # Required for Trusted Publishing

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
