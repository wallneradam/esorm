name: Release

# Publishing a GitHub Release (tag: vX.Y.Z) runs the tests, builds the package
# and uploads it to PyPI using Trusted Publishing (no API token needed).
# Afterwards the patch version on the default branch is bumped (X.Y.Z → X.Y.Z+1).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check that the tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the version in pyproject.toml ('$VERSION')"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pyesorm/
    permissions:
      id-token: write  # Required for Trusted Publishing

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  bump:
    name: Bump patch version
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # Push the version bump commit

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump the patch version in pyproject.toml (X.Y.Z → X.Y.Z+1)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          pattern = re.compile(r'^version = "(\d+)\.(\d+)\.(\d+)"$', re.MULTILINE)
          match = pattern.search(text)
          if not match:
              raise SystemExit("Version (X.Y.Z) not found in pyproject.toml")
          # Only bump if the default branch still holds the released version
          if ".".join(match.groups()) != os.environ["TAG"].removeprefix("v"):
              print("")
              raise SystemExit(0)
          major, minor, patch = match.groups()
          version = f"{major}.{minor}.{int(patch) + 1}"
          path.write_text(pattern.sub(f'version = "{version}"', text, count=1))
          print(version)
          PY
          )
          if [ -z "$VERSION" ]; then
            echo "pyproject.toml on the default branch is not $TAG anymore, nothing to bump"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION"
          git push origin HEAD
